#!/usr/bin/env python3
PACKAGE = 'igo_local_planner'
from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()
for name, default, low, high, description in [
    ('max_vel_x', .8, 0., 3., 'Forward speed bound (m/s)'),
    ('max_vel_x_backwards', .3, 0., 2., 'Reverse speed bound (m/s)'),
    ('max_vel_theta', .6, .01, 3., 'Yaw-rate bound (rad/s)'),
    ('acc_lim_x', 2., .05, 5., 'Linear acceleration bound (m/s^2)'),
    ('decel_lim_x', .18, .05, 5., 'Predicted braking deceleration (m/s^2)'),
    ('stopping_delay', 1.2, 0., 2., 'Braking response allowance in approach and stopping checks (s)'),
    ('acc_lim_theta', .5, .01, 5., 'Yaw acceleration bound (rad/s^2)'),
    ('wheelbase', .65, .1, 3., 'Measured wheelbase (m)'),
    ('max_steering_rate', .6, .05, 3., 'Front-wheel steering rate in the prediction (rad/s)'),
    ('steering_change_weight', .5, 0., 20., 'Squared front-wheel steering-rate cost'),
    ('min_turning_radius', 1.35, .1, 10., 'Minimum turning radius (m)'),
    ('xy_goal_tolerance', .5, .02, 2., 'Goal position tolerance (m)'),
    ('yaw_goal_tolerance', .3, .01, 6.29, 'Goal heading tolerance (rad)'),
    ('max_global_plan_lookahead_dist', 4., .5, 20., 'Global reference length (m)'),
    ('path_weight', 5., 0., 100., 'Squared cross-track error cost'),
    ('heading_weight', 1., 0., 100., 'Squared reference heading error cost'),
    ('obstacle_weight', 5., 0., 100., 'Soft costmap clearance cost'),
    ('progress_weight', 5., .1, 100., 'Ordered reference progress reward'),
    ('horizon', 4., 1., 8., 'Rollout duration (s)'),
    ('mean_rate', .65, .01, 1., 'IGO mean natural-gradient step'),
    ('variance_rate', .25, .01, 1., 'IGO diagonal variance natural-gradient step'),
    ('elite_fraction', .25, .05, .9, 'Rank utility quantile'),
]:
    gen.add(name, double_t, 0, description, default, low, high)
gen.add('motion_direction_mode', int_t, 0, '-1 reverse, 0 automatic, +1 forward', 0, -1, 1)
gen.add('samples', int_t, 0, 'Gaussian samples per iteration and direction', 48, 8, 256)
gen.add('iterations', int_t, 0, 'Natural-gradient updates per solve', 4, 1, 10)
gen.add('knots', int_t, 0, 'Control knots over the horizon', 10, 3, 24)
gen.add('allow_init_with_backwards_motion', bool_t, 0, 'Allow reverse trajectories', True)
gen.add('global_plan_overwrite_orientation', bool_t, 0, 'Use tangent headings for ordinary grid paths', True)
gen.add('treat_unknown_as_obstacle', bool_t, 0, 'Reject unknown cells under the full footprint', True)
exit(gen.generate(PACKAGE, 'igo_local_planner', 'IGO'))
