IGOLocalPlannerROS:
  # Complete standalone defaults, matching cfg/IGO.cfg. Override the vehicle
  # geometry and dynamics here when integrating a different chassis.
  odom_topic: /odom
  steering_topic: /m2_driver/wheel_angle
  max_vel_x: 0.8
  max_vel_x_backwards: 0.3
  max_vel_theta: 0.6
  acc_lim_x: 2.0
  acc_lim_theta: 0.5
  wheelbase: 0.65
  min_turning_radius: 1.35
  xy_goal_tolerance: 0.5
  yaw_goal_tolerance: 0.3
  max_global_plan_lookahead_dist: 4.0
  motion_direction_mode: 0
  global_plan_overwrite_orientation: true
  samples: 48
  iterations: 4
  knots: 10
  horizon: 4.0
  mean_rate: 0.65
  variance_rate: 0.25
  elite_fraction: 0.25
  path_weight: 5.0
  heading_weight: 1.0
  obstacle_weight: 5.0
  progress_weight: 5.0
  # Braking prediction is separate from start acceleration.
  decel_lim_x: 0.18
  stopping_delay: 1.2
  max_steering_rate: 0.6
  steering_change_weight: 0.5
  allow_init_with_backwards_motion: true
  treat_unknown_as_obstacle: true
